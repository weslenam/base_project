name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Derivar base do affected
        uses: nrwl/nx-set-shas@v4

      - name: Lint (affected)
        run: pnpm nx affected -t lint --parallel=3

      - name: Typecheck (affected)
        run: pnpm nx affected -t typecheck --parallel=3

      - name: Testes (affected)
        run: pnpm nx affected -t test --parallel=3
